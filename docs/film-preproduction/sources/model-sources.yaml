          claim_scope: "Sora 2 prompt and iteration behavior"
    evidence_level: S1
    official_or_primary_facts:
      - "Sora 2 creates video with synchronized audio from text or image input."
      - "input_reference anchors the first frame of one generation."
      - "Reusable character assets are for non-human subjects by default and may be combined with input_reference."
      - "The API supports targeted edits and completed-video extensions with endpoint-specific constraints."
