source_registry:
  version: "2.0.0"
  verified_date: "2026-08-29"
  accessed_on: "2026-08-29"
  purpose: "Versioned capability cards for image, video, editing, and canvas routes used by DIRcreative."
  resolution_rule: "Select by capability_card_id + version + provider_surface; model-family aliases are never sufficient. A vendor-listed product entry does not establish another platform's surface or parameters, and no platform is opened or switched automatically."
  refresh_policy:
    refresh_before_production: true
    stale_after_days: 90
    fail_closed_when_stale_or_ambiguous: true
  source_tier_precedence:
    - S1
    - S2
    - S3
    - S4

source_tiers:
  S1:
    label: "official_api_or_manual"
    authority: "May authorize a version-and-surface-scoped capability claim."
    allowed_source_types:
      - official_api_changelog
      - official_api_documentation
      - official_api_guide
      - official_api_input_manual
      - official_api_model_catalog
      - official_endpoint_manual
      - official_model_page
      - official_release_notes
      - official_stable_model_page
      - official_vertex_api_reference
    allowed_domains:
      - developers.openai.com
      - docs.dev.runwayml.com
      - docs.cloud.google.com
      - cloud.google.com
  S2:
    label: "original_research_paper"
    authority: "May support architecture or evaluated capability claims only for the named paper/model version."
    allowed_source_types:
      - original_research_paper
    allowed_domains:
      - arxiv.org
  S3:
    label: "version_scoped_official_guide"
    authority: "May authorize only the named product version, mode, and surface described by the guide."
    allowed_source_types:
      - legacy_version_scoped_official_guide
      - official_product_announcement
      - official_workflow_guide
      - version_scoped_official_guide
      - version_scoped_official_launch_guide
      - version_scoped_official_prompt_guide
    allowed_domains:
      - app.klingai.com
      - cloud.google.com
      - developers.openai.com
      - docs.tapnow.ai
      - help.runwayml.com
      - kling.ai
      - seed.bytedance.com
  S4:
    label: "community_or_github_clue"
    authority: "Clue only; cannot make a capability generation-ready without S1-S3 confirmation."

capability_card_contract:
  version: "1.0.0"
  required_fields:
    - capability_card_id
    - version
    - status
    - verified_on
    - accessed_on
    - source
    - evidence_level
    - reference_modes
    - audio_route
    - duration
    - edit
    - extension
    - rights
    - failure_modes
  status_values:
    - current
    - preview
    - legacy
    - deprecated
    - workflow_only
  invariant: "Every fact is scoped to the exact version and provider_surface on its card."

models:
  - model_key: gpt_image
    capability_card_id: gpt_image_2_openai_api
    display_name: "GPT Image 2"
    provider: openai
    provider_surface: "OpenAI Image API and Responses API image_generation tool"
    version: "gpt-image-2"
    status: current
    verified_on: "2026-07-10"
    accessed_on: "2026-07-10"
    last_verified: "2026-07-10"
    source_type: "official_api_documentation"
    primary_url: "https://developers.openai.com/api/docs/guides/image-generation"
    source:
      primary:
        tier: S1
        type: official_api_guide
        url: "https://developers.openai.com/api/docs/guides/image-generation"
        accessed_on: "2026-07-10"
        claim_scope: "gpt-image-2 through the named OpenAI API surfaces"
      supporting: []
    evidence_level: S1
    official_or_primary_facts:
      - "The Image API supports generation and edits for GPT Image models."
      - "The edits endpoint can use one or more images as references and can apply a mask."
      - "The Responses API image tool supports conversational multi-turn generation and editing."
      - "gpt-image-2 processes image inputs at high fidelity and does not expose a configurable input_fidelity value."
      - "gpt-image-2 does not support transparent backgrounds on the documented API surface."
    reference_modes:
      text_to_image: supported
      image_edit: supported
      mask_edit: supported
      multi_image_reference: supported
      multi_turn_edit: supported
      image_input_fidelity: always_high
    audio_route:
      native_audio_supported: false
      generation_audio_route: not_applicable
    duration:
      kind: not_applicable
      supported_values_sec: []
    edit:
      supported: true
      modes:
        - whole_image
        - reference_composition
        - masked_region
        - conversational_multi_turn
      preserve_change_required: true
    extension:
      supported: false
      route: image_edit_or_outpaint_prompt
    rights:
      gate: required
      required_evidence:
        - source_asset_rights
        - likeness_or_brand_authorization_when_applicable
        - openai_usage_policy_compatibility
      generation_allowed_when_unverified: false
    failure_modes:
      - precise_text_or_layout_drift
      - recurring_character_or_brand_consistency_drift
      - composition_placement_drift
      - unsupported_transparent_background
      - moderation_or_rights_gate_failure
    inferred_adapter_behavior:
      - "Resolve this card before naming output controls or reference behavior."
      - "For edits, declare non-overlapping preserve and change sets."
      - "Use multiple references only when each image has one named role."
    refresh_trigger:
      - "The OpenAI image guide changes model versions, input modes, edit behavior, or output controls."
    adapter_impact:
      - "Re-run E0-E6 and prompt-contract checks before promotion."

