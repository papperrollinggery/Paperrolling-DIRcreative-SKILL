      reusable_non_human_character: supported
      maximum_character_assets_per_generation: 2
      human_likeness_character: blocked_by_default
    audio_route:
      native_audio_supported: true
      generation_audio_route: native_synced
      prompt_section_required_when_audio_desired: true
    duration:
      kind: discrete
      supported_values_sec:
        - 4
        - 8
        - 12
        - 16
        - 20
    edit:
      supported: true
      endpoint: "POST /v1/videos/edits"
      preserve_change_required: true
      uploaded_video_access: eligible_customers_only
    extension:
      supported: true
      endpoint: "POST /v1/videos/extensions"
      max_added_sec_per_extension: 20
      max_extensions: 6
      max_total_sec: 120
      supports_characters: false
      supports_image_reference: false
    rights:
      gate: required
      blocked_by_documented_surface:
        - real_people_including_public_figures
        - human_faces_in_input_images
        - copyrighted_characters
        - copyrighted_music
      generation_allowed_when_unverified: false
    failure_modes:
      - rights_or_guardrail_rejection
      - image_reference_misread_as_more_than_first_frame
      - human_likeness_character_rejection
      - extension_with_unsupported_character_or_image_reference
      - identity_or_timing_drift_in_longer_clips
    inferred_adapter_behavior:
      - "Use a clean first frame for input_reference and keep planning boards out of that slot."
      - "Use character assets only for eligible non-human subjects unless access evidence proves otherwise."
      - "Split extension, edit, and create into separate routes."
    refresh_trigger:
      - "OpenAI changes Videos API endpoints, duration, character, extension, edit, audio, or guardrails."
    adapter_impact:
      - "Re-resolve duration, reference, audio, edit, extension, and rights routes."

