      - "Mark storyboard content as shot-language guidance instead of literal output content."
      - "Keep numeric reference limits scoped to Seedance 2.0."
    active_pattern_ids: []
    reuse_policy: "Version-scoped to Seedance 2.0; never carry limits into a family alias or later version."

  - source_key: kling_video_3_0_prompting
    version: "3.0"
    status: current_version_scoped
    source_type: version_scoped_official_guide
    evidence_level: S3
    url: "https://app.klingai.com/cn/quickstart/klingai-video-3-model-user-guide"
    last_verified: "2026-07-10"
    accessed_on: "2026-07-10"
    extracted_mechanisms:
