      - "Bind start/end frames, elements, speaker/voice, and scene actions explicitly."
      - "Use flexible duration only through the exact VIDEO 3.0 capability card."
    active_pattern_ids: []
    reuse_policy: "Do not mix VIDEO 3.0 prompt rules with the legacy 5/10-second image-to-video card."

  - source_key: runway_gen_4_5_prompting
    version: "Gen-4.5"
    status: current_version_scoped
    source_type: version_scoped_official_guide
    evidence_level: S3
    url: "https://help.runwayml.com/hc/en-us/articles/46974685288467-Creating-with-Gen-4-5"
    last_verified: "2026-07-10"
    accessed_on: "2026-07-10"
    extracted_mechanisms:
      - "Image-to-video prompts focus on scene motion; text-to-video prompts cover both visuals and motion."
      - "Generation prompts are distinct from Aleph edit prompts."
    active_pattern_ids: []
    reuse_policy: "Use only with runway_gen_4_5_web; route existing-video changes to a current edit card."

  - source_key: runway_aleph_2_0_edit_prompting
