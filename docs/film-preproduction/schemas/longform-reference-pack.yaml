  status: "candidate | selected | locked | superseded"
  user_gate:
    required: true
    status: "pending | approved | needs_revision"
  assets:
    - asset_id: ""
      role: "identity_product_board | environment_camera_board | style_material_board | audio_reference | element_reference"
      primary_job: ""
      asset_output:
        status: "prompt_ready | generated_candidate | user_locked | external_pending | external_imported | rejected"
        prompt_file: ""
        generated_file: ""
        external_instructions: ""
        source_tool: ""
        user_lock_status: "not_required | pending | locked | rejected"

sequence_packs:
  - sequence_id: ""
    pack_id: ""
    duration_sec: 15
    user_gate:
      required: true
      status: "pending | approved | needs_revision"
    continuity_reuse:
      global_asset_ids: []
      locked_identity_refs: []
      locked_style_refs: []
    capability_targets:
      - capability_card_id: ""
        operation: "generate | edit | extend"
        enabled: false
        reference_policy:
          board_input_allowed: false
          clean_start_frame_required: false
          clean_end_frame_preferred: false
          element_reference_preferred: false
          structured_reference_map_required: false
    assets:
      - asset_id: ""
        role: "scene_plate | clean_first_frame | clean_end_frame | motion_reference_video | audio_reference | storyboard_motion_board | element_reference"
        primary_job: ""
        direct_input_policy:
          - capability_card_id: ""
            input_mode: "allowed | conditional | forbidden | planning_only | element_only | reference_only"
        asset_output:
          status: "prompt_ready | generated_candidate | user_locked | external_pending | external_imported | rejected"
