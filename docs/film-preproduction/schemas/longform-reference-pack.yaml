          generated_file: ""
          external_instructions: ""
          source_tool: ""
          user_lock_status: "not_required | pending | locked | rejected"
        must_not_animate: []
        qa:
          one_primary_job: false
          video_model_safe: false
          clean_frame_available_if_needed: false
          user_gate_resolved: false

edit_assembly:
  sequence_order: []
  continuity_checks: []
  audio_spine: ""
  transition_notes: []
  retry_order: []

qa:
  global_pack_locked_or_prompt_ready: false
  per_sequence_policy_valid: false
  output_statuses_present: false
  model_budget_ok: false
  video_model_safe: false
  exact_capability_cards_resolved: false
