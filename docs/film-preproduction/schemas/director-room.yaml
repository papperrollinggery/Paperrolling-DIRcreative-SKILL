director_room:
  schema_version: "2.0.0"
  artifact_type: "dynamic_perspective_result"
  default_for_new_runs: true

  legacy_v1_compatibility:
    accepted_schema_version: "1.0.0"
    mode: "read_only"
    write_allowed: false
    fixed_role_ids:
      - "producer"
      - "creative_director"
      - "director"
      - "screenwriter"
      - "cinematographer"
      - "production_designer"
      - "editor"
      - "sound_designer"
      - "model_prompt_engineer"
      - "continuity_qa"
    note: "Existing v1 fixtures may be inspected or migrated to a new v2 artifact; never rewrite a v1 fixture in place."

  result_contract:
    required_fields:
      - "schema_version"
      - "mode"
      - "route"
      - "director_room_used"
      - "selected_perspectives"
      - "recommendation"
      - "perspective_judgments"
      - "conflict_status"
      - "disagreements"
      - "user_options_requested"
      - "user_facing_options"
      - "open_questions"
      - "final_direction_locked"
    perspective_ids:
      - "narrative_strategy"
      - "visual_production"
      - "model_continuity"
    maximum_perspectives: 3
    maximum_independent_critics: 1
    conflict_statuses:
      - "no_material_conflict"
      - "material_conflict"
    rules:
      - "Fast results set director_room_used false."
      - "perspective_judgments keys exactly match selected_perspectives."
      - "no_material_conflict requires an empty disagreements list."
      - "material_conflict requires a concrete decision pressure and competing consequences."
      - "user_facing_options stays empty unless the user requested a choice or a material conflict needs resolution."
      - "recommendation is presented before process notes and supporting judgments."
      - "final_direction_locked remains false until a real user choice or authorized delivery decision."

  canonical_example:
    schema_version: "2.0.0"
    mode: "studio"
    route: "film_development"
    director_room_used: true
    recommendation:
      summary: "Build the film around one visible product test whose consequence becomes the story turn."
      rationale: "It unifies narrative clarity, producible camera logic, and continuity-safe model inputs."
      next_output: "story package"
    selected_perspectives:
      - "narrative_strategy"
      - "visual_production"
      - "model_continuity"
    perspective_judgments:
      narrative_strategy:
        judgment: "Give the product test a pressure, reversal, and visible ending action."
        evidence: ["complete advertising-film brief", "30-second duration"]
        downstream_effect: "The story package must reserve the turn before the end card."
      visual_production:
        judgment: "Stage one motivated push-in during the test and hold long enough to read the consequence."
        evidence: ["single-location production constraint", "product legibility target"]
        downstream_effect: "Shot design owns the camera start, action path, and final product state."
      model_continuity:
        judgment: "Separate product identity, scene geography, and motion guidance; do not use a dense board as a literal first frame."
        evidence: ["identity continuity target", "reference-role boundary"]
        downstream_effect: "Reference planning must bind one role per direct input."
    conflict_status: "no_material_conflict"
    disagreements: []
    user_options_requested: false
    user_facing_options: []
    open_questions: []
    final_direction_locked: false
    execution:
      controlling_agents: 1
      threads_used: 0
      independent_critics_used: 0
      nested_dispatch_used: false
    presentation_order:
      - "recommendation"
      - "perspective_judgments"
      - "conflict_status"
      - "open_questions"
