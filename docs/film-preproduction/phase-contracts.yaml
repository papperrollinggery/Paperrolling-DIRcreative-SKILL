      - Let DIRcreative own ADCO current truth, PPT, FinalDelivery, or send readiness.
      - Claim real client acceptance from fixture or forward-test output.
      - Generate real client media without an explicit work- and asset-bound authorization.
      - Treat GitHub prompt libraries or local skill names as current capability proof.
    done_when:
      - Automatic routing selects full council, targeted professional pass, or lightweight mode without requiring users to name roles.
      - Every director-room role has typed inputs, outputs, evidence, quality gate, handoff, forbidden actions, and recovery contract.
      - Runtime state audit separates current integrity from isolated legacy debt and validates migration, disk, thread, authorization, and storage lifecycle.
      - Model and prompt guidance is source-tiered, date-bound, capability-aware, and covered by behavior evaluations.
      - Client-facing copy uses source-derived voice plus a bounded de-AI repair gate; presentation routing distinguishes editable and image-based decks.
      - Fresh Codex Thread forward tests and independent cold reviews find no blocking P0 or P1.
      - Main is committed and pushed without force, a new formal release is published, the installed package matches source, and ADCO bilateral compatibility passes.
    next_phase: none
