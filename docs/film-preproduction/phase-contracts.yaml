    name: Runtime truth and professional craft capability upgrade
    status: in_progress
    purpose: Add current-first runtime governance, automatic director-room routing, executable role harnesses, current model/prompt evidence, source-derived client copy, presentation routing, and behavior-level evaluation without weakening ADCO ownership boundaries.
    inputs:
      - user reports that director-room mode does not always auto-activate
