      - examples/cyber-courier/10-script-breakdown.yaml
      - examples/cyber-courier/11-asset-requirements.md
      - examples/cyber-courier/12-audio-policy.md
    allowed_edits:
      - examples/cyber-courier/09-script.md
      - examples/cyber-courier/10-script-breakdown.yaml
      - examples/cyber-courier/11-asset-requirements.md
      - examples/cyber-courier/12-audio-policy.md
      - docs/film-preproduction/02-execution-roadmap.md
      - docs/film-preproduction/phase-contracts.yaml
    non_goals:
      - Write shot list.
      - Write image prompts.
      - Write video prompts.
    done_when:
      - Script has scene/action/dialogue or explicit no-dialogue policy.
      - Breakdown lists characters, locations, props, wardrobe, sound, and special requirements.
      - Audio policy separates image prompt notes, video prompt audio, and post-production audio.
    next_phase: phase_d_shot_design_fixture

  - id: phase_d_shot_design_fixture
    name: Shot design fixture
    status: completed
    purpose: Turn script into professional shot plan.
    inputs:
