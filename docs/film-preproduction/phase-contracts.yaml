project:
  name: Paperrolling-DIRcreative-SKILL
  active_phase: none
  contract_version: 2
  contract_scope: repository_fixture_plan_not_chat_runtime

runtime_contract_v2:
  status: active_for_new_runs
  routing_owner: skills/dircreative/runtime/routing-policy.yaml
  compact_state_owner: skills/dircreative/runtime/state-snapshot.schema.json
  legacy_v1_co_creation_schema: docs/film-preproduction/schemas/co-creation-run.yaml
  legacy_v1_write_allowed: false
  external_gate_count: 3
  behavior:
    continue_without_real_blocker: true
    bounded_revision_restarts_idea_intake: false
    known_brief_is_reasked: false
    direct_artifact_first_response: true
    full_state_audit_per_reply: false
  full_state_audit_triggers:
    - resume
    - handoff
    - delivery
    - completion_claim

foundation_artifacts:
  chat_visualization_contract:
    status: implemented_p0_verified
    scope_note: Versioned presentation and writeback-receipt contracts, source/write boundaries, fallback behavior, user-facing stage surfaces, current-selection synchronization, customer-language leak rejection, real PNG candidate review, no-media and illustrative-media boundaries, project-root path confinement, evidence-bound source/authorization/channel status, responsive browser audit, and read-only confirmation echo are implemented. DIR-to-ADCO projection, formal local install, installed-package parity, installed validation, and browser dogfood pass. Remote release and final live-user acceptance remain separate gates.
    files:
      - docs/film-preproduction/chat-inline-visualization-interface.md
      - docs/film-preproduction/schemas/chat-visualization-spec.schema.json
      - docs/film-preproduction/schemas/chat-visualization-spec.template.yaml
      - docs/film-preproduction/schemas/chat-visualization-writeback.schema.json
      - skills/dircreative/assets/visualizations/stage-surface-registry.json
      - scripts/dircreative_visualization_spec.py
      - scripts/dircreative_visualization_audit.py
      - scripts/dircreative_visualization_render.py
      - scripts/dircreative_visualization_dogfood.py
      - scripts/dircreative_visualization_browser_audit.cjs
      - scripts/dircreative_visualization_writeback.py
      - scripts/dircreative_visualization_adco_audit.py
      - tests/fixtures/chat-visualization/
  prompt_production_system_p0_p1:
    status: implemented_pending_live_acceptance
    scope_note: User-directed executable prompt-system upgrade; external generation, formal install, release, and live acceptance remain out of scope or unverified.
    files:
      - docs/film-preproduction/schemas/prompt-ir.schema.json
      - scripts/dircreative_prompt_compiler.py
      - scripts/dircreative_prompt_fixture_audit.py
      - tests/fixtures/prompt-system/
      - docs/film-preproduction/prompt-authoring-standard-v1.md
      - docs/film-preproduction/prompt-qa-and-incident-runbook-v1.md
  prompt_style_system:
    status: completed
    scope_note: User-directed research insertion; does not change active_phase.
    files:
      - docs/film-preproduction/research/image-prompt-style-system.md
      - docs/film-preproduction/schemas/image-prompt-style-config.schema.json
      - docs/film-preproduction/templates/image-prompt-style-config.template.json
      - docs/film-preproduction/prompt-pattern-registry.json
  skill_integration_architecture:
    status: completed
    scope_note: User-directed Goal-mode planning insert; does not change active_phase.
    files:
      - docs/film-preproduction/05-skill-integration-architecture.md
      - docs/film-preproduction/schemas/skill-orchestration.yaml
  gstack_execution_goal:
    status: completed
    scope_note: Full execution target for gstack/Goal continuation; does not change active_phase.
    files:
      - docs/film-preproduction/06-gstack-execution-goal.md

global_rules:
  - Do not skip phases.
  - Do not create image or video assets until a phase explicitly allows it.
  - Do not treat the prompt compiler as the whole product.
  - Every phase must end with verification.
  - Every phase must preserve structured artifact contracts.
  - Commit only scoped, verified changes.
  - README.md and docs/film-preproduction/04-goal-mode-handoff.md may be updated during phase transitions to reflect the new active phase.

verification:
  yaml_parse: ruby -e 'require "yaml"; Dir["docs/film-preproduction/**/*.yaml"].each { |f| YAML.load_file(f); puts "ok #{f}" }'
  placeholder_scan: rg -n 'TB[D]|TO[D]O|待[定]|占[位]|x[x]x|FIX[ME]' .
  status_check: git status --short

phases:
  - id: phase_a_goal_contract_layer
    name: Goal-ready contract layer
    status: completed
    purpose: Make the repo readable and executable by Goal-mode and gstack-driven workers.
    inputs:
      - README.md
      - docs/film-preproduction/01-system-plan.md
      - docs/film-preproduction/02-execution-roadmap.md
      - docs/film-preproduction/03-office-hours-optimization-plan.md
    outputs:
      - docs/film-preproduction/04-goal-mode-handoff.md
      - docs/film-preproduction/05-skill-integration-architecture.md
      - docs/film-preproduction/phase-contracts.yaml
      - README.md
      - docs/film-preproduction/02-execution-roadmap.md
    allowed_edits:
      - README.md
      - docs/film-preproduction/02-execution-roadmap.md
      - docs/film-preproduction/03-office-hours-optimization-plan.md
      - docs/film-preproduction/04-goal-mode-handoff.md
      - docs/film-preproduction/05-skill-integration-architecture.md
      - docs/film-preproduction/06-gstack-execution-goal.md
      - docs/film-preproduction/phase-contracts.yaml
      - docs/film-preproduction/schemas/skill-orchestration.yaml
      - docs/film-preproduction/README.md
    non_goals:
      - Continue cyber-courier story development.
      - Write image prompts.
      - Write video prompts.
      - Generate images or videos.
      - Build frontend.
      - Package skills.
    done_when:
      - Phase contracts exist for all phases.
      - README points to Goal-mode handoff.
      - Roadmap status names Phase A as complete and Phase B as next.
      - Verification commands pass.
    next_phase: phase_b_story_fixture_completion

  - id: phase_b_story_fixture_completion
    name: Story fixture completion
    status: completed
    purpose: Continue the cyber-courier example from selected concept into story package.
    inputs:
      - examples/cyber-courier/01-idea-intake.md
      - examples/cyber-courier/02-director-room-notes.md
      - examples/cyber-courier/03-concept-options.md
      - examples/cyber-courier/04-selected-concept.md
      - docs/film-preproduction/schemas/story-package.yaml
      - docs/film-preproduction/research/channel-playbooks.md
    outputs:
      - examples/cyber-courier/05-logline.md
      - examples/cyber-courier/06-beat-sheet.md
      - examples/cyber-courier/07-treatment.md
      - examples/cyber-courier/08-story-review.md
    allowed_edits:
      - examples/cyber-courier/05-logline.md
      - examples/cyber-courier/06-beat-sheet.md
      - examples/cyber-courier/07-treatment.md
      - examples/cyber-courier/08-story-review.md
      - docs/film-preproduction/02-execution-roadmap.md
      - docs/film-preproduction/04-goal-mode-handoff.md
      - README.md
      - docs/film-preproduction/phase-contracts.yaml
    non_goals:
      - Write script.
      - Write shot list.
      - Write image prompts.
      - Write video prompts.
    done_when:
      - Logline, beat sheet, treatment, and story review exist.
      - Story review says whether Phase C can proceed.
      - No image or video prompt files are created.
    next_phase: phase_c_script_and_breakdown_fixture

  - id: phase_c_script_and_breakdown_fixture
    name: Script and breakdown fixture
    status: completed
    purpose: Turn approved treatment into script and production breakdown.
    inputs:
      - examples/cyber-courier/05-logline.md
      - examples/cyber-courier/06-beat-sheet.md
      - examples/cyber-courier/07-treatment.md
      - examples/cyber-courier/08-story-review.md
      - docs/film-preproduction/schemas/story-package.yaml
      - docs/film-preproduction/research/audio-design-notes.md
    outputs:
