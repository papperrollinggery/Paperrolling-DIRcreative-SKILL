      - creative, copy, image, video, layout, and presentation capability routing
      - behavior-level positive and negative evaluations
      - release, install, post-install, and ADCO bilateral receipts
    allowed_edits:
      - .gitignore
      - README.md
      - docs/film-preproduction/
      - skills/dircreative/
      - scripts/
      - tests/fixtures/
      - examples/
