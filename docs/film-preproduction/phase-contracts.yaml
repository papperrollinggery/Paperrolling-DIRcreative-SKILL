      - examples/cyber-courier/14-camera-plan.md
      - examples/cyber-courier/15-blocking-plan.md
      - examples/cyber-courier/16-shot-qa.md
      - docs/film-preproduction/02-execution-roadmap.md
      - docs/film-preproduction/phase-contracts.yaml
    non_goals:
      - Write image prompts.
      - Write video prompts.
      - Generate visual boards.
    done_when:
      - Every shot has duration, purpose, shot size, angle, lens, camera motion, subject action, blocking, and audio fields.
      - Shot QA confirms no overloaded shot.
      - YAML outputs parse.
    next_phase: phase_e_visual_bible_reference_pack

  - id: phase_e_visual_bible_reference_pack
    name: Visual bible and reference pack
