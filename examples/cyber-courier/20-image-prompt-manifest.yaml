      aspect_ratio: "16:9"
      sections:
        - "large full-body hero pose"
        - "turnaround/support views"
        - "face expression studies"
        - "wardrobe/material callouts"
      density: "medium-high but readable"
      readability_rules:
        - "labels must be short and readable"
        - "hero pose must occupy the largest region"
        - "support views must not become tiny thumbnails"
    asset_output:
      status: prompt_ready
      prompt_file: "examples/cyber-courier/prompts/image_01_character_board.txt"
      generated_file: ""
      external_instructions: "Run this prompt in the selected image tool and import the result before locking character identity."
      source_tool: none
      user_lock_status: pending
    style_config:
      config_id: "cyber_courier_character_board_v1"
      image_type: "character_design_board"
      source_patterns:
        - "art_directed_asymmetric_layout_v1"
        - "json_config_prompt_v1"
        - "surface_integrity_guard_v1"
        - "multi_panel_identity_lock_v1"
      art_direction_policy:
        non_negotiables:
          - "do not use a generic layout"
          - "do not use evenly distributed grids unless a technical sub-section requires it"
          - "do not make the layout symmetrical only for symmetry"
          - "composition must feel art-directed, intentional, and slightly asymmetric"
          - "every section must feel carefully placed, not automatically generated"
        placement_rule: "hero body pose is largest; identity and material details are placed by production importance"
      quality_and_artifact_control:
        surface_integrity_guard:
          required:
            - "clean natural materials"
            - "smooth and coherent surface texture"
            - "main subject remains clear"
            - "background depth layers remain distinct"
            - "complete object geometry"
          avoid:
            - "fish-scale texture"
            - "excessive sharpening"
            - "color speckles"
            - "random noise"
            - "cracks"
            - "collapsed surfaces"
            - "distorted geometry"
            - "broken material continuity"
        transparent_background: false
      self_update:
        registry_pattern_ids:
          - "art_directed_asymmetric_layout_v1"
          - "multi_panel_identity_lock_v1"
        qa_observations: []
    exact_text_labels:
      - "COURIER IDENTITY"
      - "RED RAIN JACKET"
      - "BLACK DELIVERY BAG"
      - "RESTRAINED DREAD"
    avoid:
      - "helmeted faceless biker"
      - "combat armor"
      - "weapon"
      - "second character"
    qa:
      role_clear: true
      text_readable: true
      panels_large_enough: true
      continuity_locks_present: true
      output_mode_supported: true
      asset_output_status_present: true
      video_model_safe: true
      capability_card_resolved: true
      rights_gate_passed: false
      preserve_change_disjoint: true
      source_reference_present_for_edit: true
      optional_qa_macro_not_forced: true

