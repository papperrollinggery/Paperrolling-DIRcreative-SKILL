model_prompts:
  seedance:
    enabled: true
    operation: generate
    capability_card_id: seedance_2_0_official_launch
    version: "2.0"
    status: current
    provider_surface: "Seedance 2.0 launch product surfaces described by ByteDance Seed"
    access_mode: documented_product
    execution_mode: manual_export
    execution_verification_status: unverified
    desired_audio:
      mode: planned_diegetic_audio
    generation_audio_route: postproduction
    rights_gate_status: unverified
    transformation_contract:
      preserve: []
      change: []
      forbidden_change: []
      overlap_check: pass
    best_for: "15s multi-reference cinematic previs with character, environment, prop, storyboard, and style references."
    prompt_file: "examples/cyber-courier/prompts/video_seedance.txt"
    reference_warning: "Storyboard/reference boards are production guidance only; do not show or animate boards, panels, layout, labels, arrows, grids, or printed text."
    audio_policy: "Preferred MVP mode is silent visual previs with post-production audio; optional generated audio uses rain ambience, neon buzz, scanner beep, intercom relay, no dialogue, no music."
    risk_notes:
      - "Dense storyboard board may be interpreted literally."
      - "Five-shot flow may compete with continuity locks."
      - "Audio support depends on selected Seedance endpoint or UI."
    retry_rules:
      - "If board appears in output, remove storyboard board reference and use shot text only."
      - "If courier identity drifts, prioritize image_01 and reduce shot count."
      - "If package becomes wrong object, add image_03 as dominant prop reference."
  kling:
    enabled: true
    operation: generate
    capability_card_id: kling_video_3_0_official_guide
    version: "3.0"
    status: current
    provider_surface: "Kling AI VIDEO 3.0 product guide"
    access_mode: documented_product
    execution_mode: manual_export
    execution_verification_status: unverified
    desired_audio:
      mode: planned_diegetic_audio
    generation_audio_route: postproduction
    rights_gate_status: unverified
    transformation_contract:
      preserve: []
      change: []
      forbidden_change: []
      overlap_check: pass
    best_for: "Per-shot image-to-video motion control from selected clean frames. Use per-shot I2V mode if the user wants all five shots controlled."
    prompt_file: "examples/cyber-courier/prompts/video_kling.txt"
    reference_warning: "Use boards only to choose clean first frames; do not feed dense boards as the main image if avoidable."
    audio_policy: "Generate visual motion only; handle rain ambience and SFX in post unless current workflow supports audio."
    risk_notes:
      - "Actions contradicting the input image can cause scene reinterpretation."
      - "Prompt should focus on subject movement, background movement, and camera movement."
      - "Hybrid pack has clean frames for SH01, SH03, and SH05 only; generate SH02/SH04 clean frames if tests drift."
    retry_rules:
      - "If model adds attackers, reduce prompt to one subject movement."
      - "If camera motion fails, lock camera and animate rain/subject only."
  runway:
    enabled: true
    operation: generate
    generation_capability_card_id: runway_gen_4_5_web
    edit_capability_card_id: ""
    deprecated_card_ids_rejected:
      - runway_gen_4_aleph_api_deprecated
    version: "Gen-4.5"
    status: current
    provider_surface: "Runway web Gen-4.5 generation"
    desired_audio:
      mode: planned_diegetic_audio
    generation_audio_route: postproduction
    rights_gate_status: unverified
    transformation_contract:
      preserve: []
      change: []
      forbidden_change: []
      overlap_check: pass
    best_for: "Short single-shot image-to-video motion tests from strong still frames."
    prompt_file: "examples/cyber-courier/prompts/video_runway.txt"
    reference_warning: "Use clean shot stills rather than the full storyboard board for generation."
    audio_policy: "Silent visual-only generation; audio planned in post-production."
    risk_notes:
      - "Long multi-shot prompts may overload the clip."
      - "Negative phrasing can behave unreliably."
      - "Hybrid pack has clean frames for SH01, SH03, and SH05 only; per-shot mode should add SH02 and SH04 clean frames."
    retry_rules:
      - "Split into one run per shot."
      - "Use positive motion wording and one dominant action."
  veo:
    enabled: true
    operation: generate
    capability_card_id: veo_3_1_generate_001_vertex_api
    version: "veo-3.1-generate-001"
    status: current
    provider_surface: "Vertex AI publisher model predictLongRunning API"
    source_conflicts:
      - "The exact stable page says sound generation is not supported; keep the family/API ambiguity visible and use post-production audio."
    desired_audio:
      mode: planned_diegetic_audio
    generation_audio_route: postproduction
    generate_audio_parameter: not_applicable
    rights_gate_status: unverified
    transformation_contract:
      preserve: []
      change: []
      forbidden_change: []
      overlap_check: pass
    best_for: "Structured cinematic prompt with subject, action, scene, camera, lighting, style, and optional audio."
    prompt_file: "examples/cyber-courier/prompts/video_veo.txt"
    reference_warning: "Reference boards are guidance for identity, geography, and shot order only; generated video should be the cinematic scene."
    audio_policy: "Post-production only for this exact stable card: rain ambience, distant city hum, neon buzz, scanner beep, relay click, no dialogue, no music."
    risk_notes:
      - "Overloaded structured prompts can create conflicting priorities."
      - "Audio behavior depends on selected Veo product/model."
    retry_rules:
      - "If shot sequence collapses, generate one 5-8s segment at a time."
      - "If audio is wrong, switch to silent visual-only and post-production audio."

universal_anti_misread_clause: |
  Use storyboard/reference boards only as production guidance.
  Do not show or animate the board, panels, text labels, arrows, grids, tables, or layout.
  Generate the cinematic scene described by the shot list.

