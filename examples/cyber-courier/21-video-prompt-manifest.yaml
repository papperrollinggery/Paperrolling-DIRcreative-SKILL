video_prompt_manifest:
  project_title: "Cyber Courier: The Alley Accepts The Package"
  target_sequence_duration: "15s"
  longform_generation_mode: "single_sequence"
  visual_output_mode: "prompt_only"
  sequence_plan: ""
  sequence_ids:
    - cyber-courier-seq-01
  selected_reference_strategy: hybrid
  reference_pack:
    - "image_01 character identity and wardrobe"
    - "image_02 alley geography and blocking"
    - "image_03 delivery bag, package, scanner state"
    - "image_04 five-shot storyboard board"
    - "image_05 lighting, palette, and texture"
    - "image_06_clean_sh01 clean first frame for SH01"
    - "image_07_clean_sh03 clean package key frame for SH03"
    - "image_08_clean_sh05 clean end frame for SH05"

