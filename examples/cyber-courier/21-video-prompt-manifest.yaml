reference_map:
  - ref_id: "image_01"
    file_or_generation_id: "generated from prompts/image_01_character_board.txt"
    role: "character_identity_reference"
    asset_output_status: prompt_ready
    use_for:
      - "same courier face"
      - "red jacket"
      - "black delivery bag"
      - "restrained dread expression"
    do_not_use_for:
      - "animating the character board layout"
      - "adding extra characters"
    external_generation_instructions: "Generate or import the character board before using as visual truth."
  - ref_id: "image_02"
    file_or_generation_id: "generated from prompts/image_02_environment_board.txt"
    role: "environment_blocking_reference"
    asset_output_status: prompt_ready
    use_for:
      - "alley axis"
      - "red sign left"
      - "blue sign deeper right"
      - "destination door"
      - "camera and courier path"
    do_not_use_for:
      - "showing a map overlay in final video"
      - "animating board labels"
    external_generation_instructions: "Generate or import the environment board, then export clean first frames separately."
  - ref_id: "image_03"
    file_or_generation_id: "generated from prompts/image_03_prop_board.txt"
    role: "prop_state_reference"
    asset_output_status: prompt_ready
    use_for:
      - "black bag"
      - "compact sealed package"
      - "red scanner pulse"
      - "hand interaction"
    do_not_use_for:
      - "turning package into weapon"
      - "showing product board layout"
    external_generation_instructions: "Generate or import the prop board before using as visual truth."
  - ref_id: "image_04"
    file_or_generation_id: "generated from prompts/image_04_storyboard_board.txt"
    role: "shot_order_reference_only"
    asset_output_status: prompt_ready
    use_for:
      - "five-shot order"
      - "timing"
      - "camera plan"
    do_not_use_for:
      - "showing or animating storyboard panels"
      - "showing labels, arrows, grids, or tables"
    external_generation_instructions: "Use as planning/Seedance/Veo guidance only; do not use as direct Kling/Runway first frame."
  - ref_id: "image_05"
    file_or_generation_id: "generated from prompts/image_05_style_board.txt"
    role: "lighting_style_reference"
    asset_output_status: prompt_ready
    use_for:
      - "blue-black rain"
      - "red scanner glow"
      - "cyan depth light"
      - "wet material behavior"
    do_not_use_for:
      - "random neon palette expansion"
      - "mood collage animation"
    external_generation_instructions: "Generate or import the style board before using as visual truth."
  - ref_id: "image_06_clean_sh01"
    file_or_generation_id: "generated from prompts/image_06_clean_sh01_start.txt"
    role: "clean_first_frame"
    asset_output_status: prompt_ready
    use_for:
      - "SH01 primary direct I2V start frame"
      - "opening geography and courier start state"
    do_not_use_for:
      - "labels or board layout"
      - "package glow"
    external_generation_instructions: "Generate or import this clean frame and user-lock it before SH01 direct I2V."
  - ref_id: "image_07_clean_sh03"
    file_or_generation_id: "generated from prompts/image_07_clean_sh03_package.txt"
    role: "clean_key_frame"
    asset_output_status: prompt_ready
    use_for:
      - "SH03 primary direct I2V macro input"
      - "package scanner pulse state"
    do_not_use_for:
      - "turning package into a weapon"
      - "showing labels or board layout"
    external_generation_instructions: "Generate or import this clean macro frame and user-lock it before SH03 direct I2V."
  - ref_id: "image_08_clean_sh05"
    file_or_generation_id: "generated from prompts/image_08_clean_sh05_end.txt"
    role: "clean_end_frame"
    asset_output_status: prompt_ready
    use_for:
      - "SH05 end-state reference"
      - "sealed door intercom activation"
    do_not_use_for:
      - "door opening"
      - "recipient reveal"
      - "labels or board layout"
    external_generation_instructions: "Generate or import this clean end frame and user-lock it before SH05 direct I2V."

