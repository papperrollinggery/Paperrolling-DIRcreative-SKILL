  output_artifacts:
    - examples/complete-idea-segmentation-test/15-co-creation-run.yaml
  decisions:
    - "Use a complete-idea segmentation fixture to test non-brainstorming entry."
    - "Run director-room as complete-idea validation, not broad concept invention."
    - "Expose QA/retry rules before assisted image or video generation."
    - "Keep clean-frame generation pending and media blocked."
  unresolved_questions:
    - "Real user should choose prompt-only, sequential V2 regeneration, or external locked references before one video model test."
