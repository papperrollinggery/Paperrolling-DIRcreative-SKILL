    gate_type: concept_options_gate
    status: approved
    decision_source: simulated_fixture
    options_presented:
      - "Option A: Wasteland Sanitation Route"
      - "Option B: The Last Recycling Clerk"
      - "Option C: Dawn Disinfection Parade"
    selected_option: "Option A: Wasteland Sanitation Route"
    rationale: "Best fit for 180s longform test because it has one worker, one vehicle, one prop objective, and clear action escalation."
    downstream_artifacts:
      - examples/zombie-cleaner-test/04-selected-concept.md
      - examples/zombie-cleaner-test/05-story-package.md
    blocks: []
    notes:
      - "Fixture selection only. A live run must ask the user."
  - gate_id: zc-gate-02
    gate_type: story_approval_gate
    status: approved
    decision_source: simulated_fixture
    options_presented:
