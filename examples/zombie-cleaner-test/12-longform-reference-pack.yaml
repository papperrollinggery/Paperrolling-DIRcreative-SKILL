      global_asset_ids: [zc_image_01, zc_image_02]
      locked_identity_refs: ["same worker", "same street sweeper", "UNIT 47"]
      locked_style_refs: ["pre-dawn blue", "amber hazard light", "wet asphalt"]
    capability_targets:
      - capability_card_id: seedance_2_0_official_launch
