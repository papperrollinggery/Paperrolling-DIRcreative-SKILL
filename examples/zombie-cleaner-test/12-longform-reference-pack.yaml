    status: approved
  assets:
    - asset_id: zc_image_01
      role: identity_product_board
      primary_job: "Lock sanitation worker identity and wardrobe."
      asset_output:
        status: prompt_ready
        prompt_file: "examples/zombie-cleaner-test/11-image-prompt-manifest.yaml#zc_image_01"
        generated_file: ""
        external_instructions: "Generate or import before user lock."
        source_tool: none
        user_lock_status: pending
    - asset_id: zc_image_02
      role: identity_product_board
      primary_job: "Lock street sweeper vehicle geometry."
      asset_output:
        status: prompt_ready
        prompt_file: "examples/zombie-cleaner-test/11-image-prompt-manifest.yaml#zc_image_02"
        generated_file: ""
        external_instructions: "Generate or import before user lock."
        source_tool: none
        user_lock_status: pending
