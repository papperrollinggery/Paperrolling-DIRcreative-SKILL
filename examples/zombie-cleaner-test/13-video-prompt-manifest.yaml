    role: "vehicle_reference"
    asset_output_status: prompt_ready
    use_for: ["street sweeper geometry", "front brushes", "foam tank", "UNIT 47 decal"]
    do_not_use_for: ["military vehicle", "clean sci-fi car", "changing brush shape"]
