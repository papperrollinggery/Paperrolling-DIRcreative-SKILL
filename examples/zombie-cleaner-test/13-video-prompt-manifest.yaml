model_prompts:
  seedance:
    enabled: true
    operation: generate
    capability_card_id: seedance_2_0_official_launch
    version: "2.0"
    status: current
    provider_surface: "Seedance 2.0 launch product surfaces described by ByteDance Seed"
    access_mode: documented_product
    execution_mode: manual_export
    execution_verification_status: unverified
    desired_audio:
      mode: planned_diegetic_audio
    generation_audio_route: postproduction
    rights_gate_status: unverified
    transformation_contract:
      preserve: []
      change: []
      forbidden_change: []
      overlap_check: pass
    best_for: "15s multi-shot sequence units with explicit image-role bindings."
    prompt: |
      REFERENCE MAP
      @Image1 = sanitation worker identity and orange suit.
      @Image2 = rusted street sweeper UNIT 47 and rotating brushes.
      @Image3 = quarantine route geography and scene plates.
      @Image4 = sequence order guidance only. Do not show or animate the board, labels, arrows, or panel layout.

      TASK
      Generate twelve 15-second clips for an original black-comedy atom-punk zombie short. Keep the same worker, same street sweeper, and same glowing green barrel. The worker follows a municipal cleanup route through a zombie quarantine district and accidentally cleans the block by using the street sweeper, foam sprayer, and recycling compactor.

      AUDIO
      No dialogue. Use engine rattle, warning jingle, brush scrape, zombie shuffle, Geiger clicks, compactor belt, and dawn ambience when supported.
    reference_warning: "Storyboard and route boards are production guidance only; do not show or animate labels, arrows, grids, panels, or board layout."
    audio_policy: "Native audio allowed only if selected Seedance path supports it; otherwise export as post audio plan."
    risk_notes:
      - "Longform continuity may drift if generated all at once."
      - "Dense board may be misread without role binding."
    retry_rules:
      - "If board appears in output, remove zc_image_04 and use text sequence plan only."
      - "If vehicle drifts, prioritize zc_image_02 and reduce crowd action."
  kling:
    enabled: true
    operation: generate
    capability_card_id: kling_video_3_0_official_guide
    version: "3.0"
    status: current
    provider_surface: "Kling AI VIDEO 3.0 product guide"
    access_mode: documented_product
    execution_mode: manual_export
    execution_verification_status: unverified
    desired_audio:
      mode: planned_diegetic_audio
    generation_audio_route: postproduction
    rights_gate_status: unverified
    transformation_contract:
      preserve: []
      change: []
      forbidden_change: []
      overlap_check: pass
    best_for: "Per-sequence image-to-video runs from clean start/end frames and element references."
    prompt: |
      Reference boards are planning guidance only; do not show or animate board labels, panels, arrows, route maps, grids, timing text, or layout.
      Use a text-free clean first frame for the selected sequence. The same sanitation worker in an orange rubber suit operates the same rusted UNIT 47 street sweeper. Subject movement, background movement, and camera movement must match the first frame. Keep zombies slow, readable, and secondary to the worker and vehicle.
    reference_warning: "Do not use zc_image_03 or zc_image_04 dense boards as direct first frames. Use clean start/end frames and element references."
    audio_policy: "Visual-only generation preferred; add engine, jingle, zombie shuffle, Geiger, and compactor sounds in post."
    risk_notes:
      - "Direct first frame mismatch can change vehicle geometry."
      - "Crowd action can overload the frame."
    retry_rules:
      - "If crowd breaks, reduce zombies to three foreground figures plus background silhouettes."
      - "If vehicle changes, lock camera and animate brushes only."
  runway:
    enabled: true
    operation: generate
    generation_capability_card_id: runway_gen_4_5_web
    edit_capability_card_id: ""
    deprecated_card_ids_rejected:
      - runway_gen_4_aleph_api_deprecated
    version: "Gen-4.5"
    status: current
    provider_surface: "Runway web Gen-4.5 generation"
    desired_audio:
      mode: planned_diegetic_audio
    generation_audio_route: postproduction
    rights_gate_status: unverified
    transformation_contract:
      preserve: []
      change: []
      forbidden_change: []
      overlap_check: pass
    best_for: "Short single-beat motion tests from clean frames."
    prompt: |
      Reference boards are planning guidance only; do not show board labels, panels, arrows, route maps, grids, timing text, or layout.
      The orange-suited sanitation worker drives the rusted street sweeper through a wet zombie quarantine street. The rotating brushes scrape water and debris while slow zombies shuffle behind. The camera tracks smoothly beside the vehicle. Keep the worker, vehicle, and glowing green barrel consistent.
    reference_warning: "Use one clean image per run. Avoid dense boards, route maps, labels, and multi-sequence prompts."
    audio_policy: "Silent visual-only generation; audio handled after edit."
    risk_notes:
      - "Multi-shot instructions can weaken motion clarity."
      - "Negative prompt chains may create artifacts."
    retry_rules:
      - "Split into one run per sequence or per action beat."
      - "Use one dominant action: drive, brush, foam, hook, belt, or exit."
  veo:
    enabled: true
    operation: generate
    capability_card_id: veo_3_1_generate_001_vertex_api
    version: "veo-3.1-generate-001"
    status: current
    provider_surface: "Vertex AI publisher model predictLongRunning API"
    source_conflicts:
      - "The exact stable page says sound generation is not supported; keep the family/API ambiguity visible and use post-production audio."
    desired_audio:
      mode: planned_diegetic_audio
    generation_audio_route: postproduction
    generate_audio_parameter: not_applicable
    rights_gate_status: unverified
    transformation_contract:
      preserve: []
      change: []
      forbidden_change: []
      overlap_check: pass
    best_for: "Structured sequence prompts with subject, action, scene, camera, lighting, style, and audio."
    prompt: |
      Reference boards are planning guidance only; do not show or animate board labels, panels, arrows, route maps, grids, timing text, or layout.
      Subject: tired municipal sanitation worker in worn orange rubber suit, cracked clear face shield, black gloves, driving rusted street sweeper UNIT 47.
      Action: follows a cleanup route through a zombie quarantine district, collects a glowing green barrel, herds zombies by accident, triggers a recycling compactor, and exits at dawn.
      Scene: wet atom-punk city, flooded alley, service lane, recycling yard, clean dawn street.
      Camera: 28mm ruined street wides, 35mm vehicle tracking, 85mm gross-comedy inserts, controlled top-down route references translated into live action.
      Style: black comedy, civic apocalypse, sodium amber and sickly green glow, no graphic gore.
      Audio: engine rattle, warning jingle, brush scrape, zombie shuffle, Geiger clicks, compactor belt, no dialogue.
    reference_warning: "Reference boards guide identity, vehicle, route, and sequence order only; final video should be the cinematic scene."
    audio_policy: "Post-production only for this exact stable card; preserve the structured audio plan for editorial."
    risk_notes:
      - "Complex 180s plan should be exported as sequence prompts."
      - "Too many zombie subjects can reduce identity consistency."
    retry_rules:
      - "If continuity drifts, generate one 15s sequence at a time."
      - "If audio is wrong, switch to visual-only export and post audio."

universal_anti_misread_clause: |
  Use storyboard/reference boards only as production guidance.
  Do not show or animate the board, panels, text labels, arrows, grids, tables, route maps, timing text, or layout.
  Generate the cinematic scene described by the shot list and sequence plan.

