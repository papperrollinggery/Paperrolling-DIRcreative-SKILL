    use_for: ["same worker face", "orange suit", "face shield", "clipboard behavior"]
    do_not_use_for: ["animating character board", "adding military armor", "copying existing short film character"]
    external_generation_instructions: "Generate or import the worker board before using it as visual truth."
  - ref_id: zc_image_02
