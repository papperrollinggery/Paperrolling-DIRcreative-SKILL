artifact:
  artifact_id: zombie-cleaner-image-prompt-manifest-v1
  version: 1.0.0
  source_artifact_ids:
    - zombie-cleaner-reference-pack-plan-v1
    - zombie-cleaner-visual-bible-v1
  status: approved
  owner_skill: image-prompt-compiler

image_prompt_manifest:
  project_title: "Wasteland Sanitation Route"
  generation_target: "longform_reference_pack"
  image_model: "GPT Image / Image2 compatible"
  authoring_mode: "json_first"
  visual_output_mode: "prompt_only"
  longform_generation_mode: "hybrid"
  sequence_plan: "examples/zombie-cleaner-test/08-sequence-plan.yaml"
  style_system:
    style_schema: "docs/film-preproduction/schemas/image-prompt-style-config.schema.json"
    pattern_registry: "docs/film-preproduction/prompt-pattern-registry.json"
    selected_pattern_ids:
      - art_directed_asymmetric_layout_v1
      - json_config_prompt_v1
      - surface_integrity_guard_v1
      - multi_panel_identity_lock_v1
  global_style_locks:
    - "atom-punk municipal apocalypse"
    - "black comedy without graphic gore"
    - "orange sanitation suit, green barrel glow, amber hazard lights"
    - "wet asphalt and rusted civic machinery"
  global_avoid:
    - "copying Zombie Scavenger"
    - "generic zombie poster"
    - "military squad"
    - "fake microtext"
    - "overloaded equal grid"
    - "excessive gore"

capability_resolution:
  registry_path: "docs/film-preproduction/sources/model-sources.yaml"
  registry_version: "2.0.0"
  capability_card_id: gpt_image_2_openai_api
  version: "gpt-image-2"
  status: current
  provider_surface: "OpenAI Image API and Responses API image_generation tool"
  verified_on: "2026-07-10"
  accessed_on: "2026-07-10"
  evidence_level: S1
  source_urls:
    - "https://developers.openai.com/api/docs/guides/image-generation"
  source_conflicts: []
  access_mode: api
  execution_mode: api
  execution_verification_status: unverified
  resolution_status: resolved

rights_gate:
  status: unverified
  conditions: []
  source_asset_rights: "Prompt-only artifact; rights must be verified before generation."
  likeness_authorization: unverified
  brand_or_character_authorization: unverified
  provider_restrictions_checked: true
  evidence_refs: []
  generation_allowed: false

audio_intent:
  desired_audio: downstream_metadata_only
  generation_audio_route: not_applicable
  prohibited_in_image_prompt: true


execution_capabilities:
  image_generation:
    available: false
    provider: none
    allowed_by_user: false
    external_upload_authorized: false
    external_execution_state: instructions_only
    external_execution_evidence: []
  video_generation:
    available: false
    provider: none
    allowed_by_user: false
  file_write:
    available: true
  browser_review:
    available: false

images:
