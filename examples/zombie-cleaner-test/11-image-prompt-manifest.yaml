    type: "character_design_board"
    purpose: "Lock sanitation worker identity, wardrobe, expression, and props."
    sequence_id: "global"
    input_dependencies:
      story_package: "examples/zombie-cleaner-test/05-story-package.md"
      shot_list: "examples/zombie-cleaner-test/07-shot-list.yaml"
      visual_bible: "examples/zombie-cleaner-test/09-visual-bible.md"
      sequence_plan: "examples/zombie-cleaner-test/08-sequence-plan.yaml"
      reference_pack_manifest: "examples/zombie-cleaner-test/10-reference-pack-plan.yaml"
    layout:
      aspect_ratio: "16:9"
      sections:
        - "large full-body worker hero"
        - "face shield close-up"
        - "clipboard and rubber stamp"
        - "glove, boot, and suit material callouts"
      density: "medium, readable"
      readability_rules:
        - "hero worker must dominate"
        - "labels are short and large"
        - "support views remain large enough for identity lock"
    asset_output:
      status: prompt_ready
      prompt_file: "examples/zombie-cleaner-test/11-image-prompt-manifest.yaml#zc_image_01"
      generated_file: ""
      external_instructions: "Generate externally or with authorized image generation before locking hero identity."
      source_tool: none
      user_lock_status: pending
    style_config:
      config_id: zc_character_board_v1
      image_type: character_design_board
      source_patterns: [art_directed_asymmetric_layout_v1, json_config_prompt_v1, surface_integrity_guard_v1, multi_panel_identity_lock_v1]
      art_direction_policy:
        non_negotiables:
          - "do not use a generic model sheet"
          - "do not use evenly distributed panels unless a small technical detail strip requires it"
          - "composition must feel art-directed, intentional, and slightly asymmetric"
        placement_rule: "large worker pose anchors the board; props and material details support identity."
      quality_and_artifact_control:
        surface_integrity_guard:
          required: ["matte orange rubber suit", "clear cracked face shield", "coherent gloves and boots", "complete body geometry"]
          avoid: ["plastic toy look", "fish-scale texture", "fake tiny labels", "warped hands"]
        transparent_background: false
      self_update:
        registry_pattern_ids: [art_directed_asymmetric_layout_v1, surface_integrity_guard_v1, multi_panel_identity_lock_v1]
        qa_observations: []
    prompt: |
      Pre-generation contract:
      Largest title on the page: CHARACTER IDENTITY REFERENCE / SANITATION WORKER BOARD
      Smaller metadata only: Project: Wasteland Sanitation Route
      Do not make Wasteland Sanitation Route the largest title.
      Direct video input policy: NOT DIRECT VIDEO INPUT; use this board only to lock worker identity, protective suit, face shield, gloves, and route-form props.

      {
        "artifact": "cinematic character design board for a wasteland sanitation worker",
        "layout_policy": "art-directed asymmetric production board, no generic equal grid",
        "hero": "tired municipal cleanup worker in worn orange rubber suit, cracked clear face shield, black gloves, utility boots, calm bureaucratic expression",
        "support_panels": ["face shield close-up", "clipboard and rubber stamp", "glove and sleeve material", "boot and wet asphalt contact"],
        "text_labels": ["WORKER ID", "ORANGE SUIT", "FACE SHIELD", "ROUTE FORM"],
        "style": "atom-punk zombie cleanup comedy, wet asphalt, amber hazard light, green biohazard glow"
      }
    exact_text_labels: ["WORKER ID", "ORANGE SUIT", "FACE SHIELD", "ROUTE FORM"]
    avoid: ["superhero armor", "military helmet", "copying existing short film character", "graphic gore"]
    qa:
      role_clear: true
      text_readable: true
      panels_large_enough: true
      continuity_locks_present: true
      output_mode_supported: true
      asset_output_status_present: true
      video_model_safe: true
      capability_card_resolved: true
      rights_gate_passed: false
      preserve_change_disjoint: true
      source_reference_present_for_edit: true
      optional_qa_macro_not_forced: true
