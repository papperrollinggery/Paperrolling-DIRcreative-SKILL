artifact:
  artifact_id: zombie-cleaner-sequence-plan-v1
  version: 1.0.0
  source_artifact_ids:
    - zombie-cleaner-shot-list-v1
  status: approved
  owner_skill: sequence-planner

sequence_plan:
  project_title: "Wasteland Sanitation Route"
  version: "1.0.0"
  target_duration_sec: 180
  channel: "ai_short_film"
  source_artifact_ids:
    - zombie-cleaner-shot-list-v1
  longform_generation_mode: hybrid
  visual_output_mode: prompt_only

generation_unit_policy:
  target_unit_sec: 15
  min_unit_sec: 5
  max_unit_sec: 15
  allow_multi_shot_inside_unit: true
  split_when:
    - "zombie crowd scale drifts"
    - "vehicle geometry changes"
    - "barrel glow becomes unclear"
    - "camera move overloads one generation"

execution_capabilities:
  image_generation:
    available: false
    provider: none
    allowed_by_user: false
  video_generation:
    available: false
    provider: none
    allowed_by_user: false
  file_write:
    available: true
  browser_review:
    available: false

user_gates:
  sequence_plan_gate:
    required: true
    status: approved
  global_visual_lock_gate:
    required: true
    status: approved
  per_sequence_gate_policy: required
  batch_skip_per_sequence_gate: false
  accepted_risk: []

global_continuity_anchors:
  identity:
    - "same tired sanitation worker, orange rubber suit, clear face shield, practical posture"
  product_or_prop:
    - "rusted street sweeper with Unit 47 decal"
    - "single glowing green waste barrel"
    - "clipboard and rubber stamp"
  wardrobe:
    - "orange sanitation suit, black gloves, cracked face shield, utility boots"
  locations:
    - "quarantine street, flooded alley, service lane, recycling yard, clean dawn street"
  palette_lighting:
    - "sodium amber, diseased green glow, blue pre-dawn haze, wet asphalt"
  lens_camera:
    - "28mm wasteland wides, 35mm vehicle tracking, 85mm gross-comedy inserts"
  audio:
    - "no dialogue, engine rattle, sweeper jingle, zombie shuffle, Geiger clicks"

sequences:
  - sequence_id: zc-seq-01
    duration_sec: 15
    generation_units: 1
    dramatic_function: "Cold open route begins."
    shots: [ZC01]
    continuity_anchors: ["worker identity", "street sweeper", "pre-dawn quarantine"]
    required_reference_pack_id: zc-seq-01-pack
    clean_start_frame_required: true
    clean_end_frame_required: true
    user_gate: {required: true, status: approved}
    edit_handoff: {incoming_transition: "black to hazard lights", outgoing_transition: "clipboard cut to alley glow", audio_handoff: "siren into jingle", retry_priority: high}
  - sequence_id: zc-seq-02
    duration_sec: 15
