    file_or_generation_id: "generated from examples/live-user-sim-noodle/10-image-prompt-manifest.yaml"
    role: "product_identity_reference"
    asset_output_status: prompt_ready
    use_for:
      - "cup identity"
      - "red seal tab"
      - "broth and noodle texture"
      - "steam behavior"
    do_not_use_for:
