model_prompts:
  seedance:
    enabled: true
    operation: generate
    capability_card_id: seedance_2_0_official_launch
    version: "2.0"
    status: current
    provider_surface: "Seedance 2.0 launch product surfaces described by ByteDance Seed"
    access_mode: documented_product
    execution_mode: manual_export
    execution_verification_status: unverified
    desired_audio:
      mode: planned_diegetic_audio
    generation_audio_route: postproduction
    rights_gate_status: unverified
    transformation_contract:
      preserve: []
      change: []
      forbidden_change: []
      overlap_check: pass
    best_for: "One 15s multi-reference product ad where product, office, and shot order must stay coordinated."
    prompt: |
      REFERENCE MAP
      @image noodle_image_01 = product identity, red seal, broth, noodles, steam.
      @image noodle_image_02 = office desk, worker blocking, monitor blue, lamp amber, clean-frame source.
      @image noodle_image_03 = lighting/material/style only. Do not show or animate style board labels, swatches, panels, or layout.
      @image noodle_image_04 = shot order only. Do not show or animate storyboard labels, panels, arrows, or timing text.

      VIDEO TASK
      Generate a 15-second vertical cinematic product ad. Cold office screen light, tired worker, unopened ivory noodle cup. The hand pulls the red seal tab, the indicator warms amber, steam rises through blue monitor light, the worker takes one quiet sip, and the final frame holds on the steaming cup by the rainy city window.

      CONTINUITY LOCKS
      Same ivory cup, same red seal band, same copper lid edge, same worker, same desk, natural steam, clean broth and noodles, no exaggerated snack-commercial energy.

      AUDIO
      Office hum, peel tab, soft heat click, steam, spoon touch, distant elevator bell. No dialogue. Keep music optional and minimal.
    reference_warning: "Reference boards are production guidance only; do not animate labels, arrows, panels, board borders, or timing text."
    audio_policy: "Diegetic sound may be generated if supported; no dialogue; music optional in post."
    risk_notes:
      - "Storyboard board can be misread as final visual layout."
      - "Steam can become explosive if over-described."
    retry_rules:
      - "If storyboard panels appear, remove noodle_image_03 and keep shot order as text."
      - "If product label drifts, prioritize noodle_image_01 and reduce actor movement."
  kling:
    enabled: true
    operation: generate
    capability_card_id: kling_video_3_0_official_guide
    version: "3.0"
    status: current
    provider_surface: "Kling AI VIDEO 3.0 product guide"
    access_mode: documented_product
    execution_mode: manual_export
    execution_verification_status: unverified
    desired_audio:
      mode: planned_diegetic_audio
    generation_audio_route: postproduction
    rights_gate_status: unverified
    transformation_contract:
      preserve: []
      change: []
      forbidden_change: []
      overlap_check: pass
    best_for: "Direct I2V from clean N01 or N05 stills after images are generated externally."
    prompt: |
      Reference boards are planning guidance only; do not show or animate board labels, panels, arrows, grids, timing text, callouts, or layout.
      A late-night office worker sits at a quiet desk beside a rainy city window. Soft steam rises from an ivory noodle cup with a red seal band. The camera makes a small slow push toward the cup while blue monitor light and warm desk-lamp light mix naturally. The worker reaches in gently and the steam moves upward in soft layers.
    reference_warning: "Use one clean text-free frame from noodle_image_02 or dedicated clean-frame output; do not use storyboard board as the main input."
    audio_policy: "Visual-only generation preferred; add office hum, tab peel, steam, and elevator bell in post."
    risk_notes:
      - "Kling may follow the still strongly and resist multi-shot changes."
      - "Dense boards can be interpreted as actual panels."
    retry_rules:
      - "If motion is unstable, keep camera locked and animate steam only."
      - "If hands deform, use a clean frame without hand contact."
  runway:
    enabled: true
    operation: generate
    generation_capability_card_id: runway_gen_4_5_web
    edit_capability_card_id: ""
    deprecated_card_ids_rejected:
      - runway_gen_4_aleph_api_deprecated
    version: "Gen-4.5"
    status: current
    provider_surface: "Runway web Gen-4.5 generation"
    desired_audio:
      mode: planned_diegetic_audio
    generation_audio_route: postproduction
    rights_gate_status: unverified
    transformation_contract:
      preserve: []
      change: []
      forbidden_change: []
      overlap_check: pass
    best_for: "Short single-beat motion from a strong clean product or office still."
    prompt: |
      Reference boards are planning guidance only; do not show board labels, panels, arrows, grids, timing text, callouts, or layout.
      Soft steam rises from the ivory noodle cup on a late-night office desk. Blue monitor light and warm desk lamp create a calm contrast. The worker's hand steadies the cup and the camera slowly pushes in. Keep the product label stable and the steam natural.
    reference_warning: "Use one clean still per run. Avoid storyboard boards and long five-shot scripts."
    audio_policy: "Silent visual-only generation; audio handled in edit."
    risk_notes:
      - "Long prompts can reduce Runway motion clarity."
      - "Product typography can drift if the still is weak."
    retry_rules:
      - "Split N01, N02, N03, N04, and N05 into separate runs if the full 15s collapses."
      - "Use positive wording and one dominant action."
  veo:
    enabled: true
    operation: generate
    capability_card_id: veo_3_1_generate_001_vertex_api
    version: "veo-3.1-generate-001"
    status: current
    provider_surface: "Vertex AI publisher model predictLongRunning API"
    source_conflicts:
      - "The exact stable page says sound generation is not supported; keep the family/API ambiguity visible and use post-production audio."
    desired_audio:
      mode: planned_diegetic_audio
    generation_audio_route: postproduction
    generate_audio_parameter: not_applicable
    rights_gate_status: unverified
    transformation_contract:
      preserve: []
      change: []
      forbidden_change: []
      overlap_check: pass
    best_for: "Structured full-scene product film prompt with audio notes."
    prompt: |
      Reference boards are planning guidance only; do not show or animate board labels, panels, arrows, grids, timing text, callouts, or layout.
      Subject: a late-night office worker with an ivory self-heating noodle cup marked MIDNIGHT BROTH, red seal band, copper lid edge.
      Action: the worker rubs one eye, pulls the red seal tab, watches steam rise from clean broth and noodles, takes one quiet sip, and leaves the cup steaming in a final hero frame.
      Scene: quiet office desk near a rainy city window, blue monitor light, warm desk lamp, laptop edge and spoon for scale.
      Camera: 28mm slow desk push, 85mm macro red seal insert, 50mm steam tilt, 50mm first-sip dolly, 70mm locked product hero.
      Lighting and style: cinematic restrained food realism, monitor blue versus desk-lamp amber, natural steam and tactile matte paper cup.
      Audio: office hum, peel tab, soft heat click, steam, spoon touch, distant elevator bell, no dialogue.
    reference_warning: "Use reference boards only to preserve product identity, environment, and shot order; final output is the cinematic ad, not a production board."
    audio_policy: "Post-production only for this exact stable card: diegetic sound, no dialogue, and optional music."
    risk_notes:
      - "Too many food details can create texture noise."
      - "Audio behavior depends on selected Veo path."
    retry_rules:
      - "If the sequence collapses, generate activation, steam, and hero cup as separate clips."
      - "If audio is inaccurate, switch to silent visual-only and add sound in post."

universal_anti_misread_clause: |
  Reference boards are production guidance only.
  Do not show or animate board panels, text labels, arrows, timing text, callouts, grids, or layout.
  Generate the actual late-night noodle cup product ad described by the shot list.

