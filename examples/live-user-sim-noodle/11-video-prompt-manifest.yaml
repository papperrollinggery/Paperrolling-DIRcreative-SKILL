      - "adding fake product text"
    external_generation_instructions: "Generate or import the product identity board before using it as visual truth."
  - ref_id: noodle_image_02
    file_or_generation_id: "generated from examples/live-user-sim-noodle/10-image-prompt-manifest.yaml"
    role: "office_environment_reference"
