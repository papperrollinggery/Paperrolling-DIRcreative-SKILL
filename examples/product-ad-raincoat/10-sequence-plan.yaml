artifact:
  artifact_id: rainlock-180-sequence-plan-v1
  version: 1.0.0
  source_artifact_ids:
    - rainlock-selected-concept-v1
    - rainlock-shot-list-v1
  status: approved
  owner_skill: sequence-planner
  created_at: "2026-05-15"
  locked_by_user: false

sequence_plan:
  project_title: "RainLock Commuter Shell: 3-Minute Commuter Proof Film"
  version: "1.0.0"
  target_duration_sec: 180
  channel: "brand_film_and_social_cutdowns"
  source_artifact_ids:
    - rainlock-selected-concept-v1
    - rainlock-shot-list-v1
  longform_generation_mode: hybrid
  visual_output_mode: prompt_only

generation_unit_policy:
  target_unit_sec: 15
  min_unit_sec: 5
  max_unit_sec: 15
  allow_multi_shot_inside_unit: true
  split_when:
    - "dialogue sync is critical"
    - "product proof must be exact"
    - "commuter identity drifts"
    - "camera move overloads one generation"

execution_capabilities:
  image_generation:
    available: false
    provider: none
    allowed_by_user: false
  video_generation:
    available: false
    provider: none
    allowed_by_user: false
  file_write:
    available: true
  browser_review:
    available: false

user_gates:
  sequence_plan_gate:
    required: true
    status: approved
  global_visual_lock_gate:
    required: true
    status: approved
  per_sequence_gate_policy: required
  batch_skip_per_sequence_gate: false
  accepted_risk: []

global_continuity_anchors:
  identity:
    - "same early-30s city commuter, calm expression, practical posture"
  product_or_prop:
    - "graphite RainLock shell, sealed zipper, structured hood, dry work shirt collar"
  wardrobe:
    - "work trousers, leather work bag, no hiking gear"
  locations:
    - "apartment doorway, lobby threshold, city rain, crosswalk, station platform, office arrival"
  palette_lighting:
    - "amber interiors, steel blue rain exterior, graphite shell, natural wet reflections"
  lens_camera:
    - "28mm threshold wides, 35mm tracking, 85mm macro water-bead inserts, 50mm payoff close-ups"
  audio:
    - "rain, fabric, footsteps, transit ambience, no dialogue by default"

sequences:
  - sequence_id: rainlock-seq-01
    duration_sec: 15
    generation_units: 1
    dramatic_function: "Hook: the commuter sees the storm and chooses to step out."
    shots: ["R01", "R02"]
    continuity_anchors: ["graphite shell", "dry collar", "lobby threshold"]
    required_reference_pack_id: rainlock-seq-01-pack
    clean_start_frame_required: true
    clean_end_frame_required: true
    user_gate:
      required: true
      status: approved
    edit_handoff:
      incoming_transition: "cold open from black to lobby door reflection"
      outgoing_transition: "match cut from door push to exterior rain"
      audio_handoff: "interior room tone becomes heavy rain"
      retry_priority: high
  - sequence_id: rainlock-seq-02
    duration_sec: 15
    generation_units: 1
    dramatic_function: "Water proof: rain beads and rolls off without soaking the shell."
    shots: ["R02", "R03"]
    continuity_anchors: ["sealed zipper", "water bead macro", "same shell geometry"]
    required_reference_pack_id: rainlock-seq-02-pack
    clean_start_frame_required: true
