model_prompts:
  seedance:
    enabled: true
    operation: generate
    capability_card_id: seedance_2_0_official_launch
    version: "2.0"
    status: current
    provider_surface: "Seedance 2.0 launch product surfaces described by ByteDance Seed"
    access_mode: documented_product
    execution_mode: manual_export
    execution_verification_status: unverified
    desired_audio:
      mode: planned_diegetic_audio
    generation_audio_route: postproduction
    rights_gate_status: unverified
    transformation_contract:
      preserve: []
      change: []
      forbidden_change: []
      overlap_check: pass
    best_for: "15s multi-reference product proof sequence using material, use-case, and shot-order references."
    prompt: |
      REFERENCE MAP
      rainlock_image_01 = product material and geometry reference.
      rainlock_image_02 = commuter use-case and first-frame reference.
      rainlock_image_03 = shot-order reference only. Do not show or animate the storyboard board, labels, panel borders, or timing text.
      rainlock_image_04 = lighting/material/style reference only. Do not show style swatches, labels, or board layout.

      VIDEO TASK
      Generate a 15-second premium urban product ad. The commuter steps from a warm lobby into heavy rain, water beads roll off the graphite shell, the commuter crosses a wet city street, adjusts the hood once, and arrives at a train platform with a dry collar and composed expression.

      CONTINUITY LOCKS
      Same graphite shell, same sealed zipper line, same hood shape, same commuter bag, same real city rain, no outdoor mountain setting.

      AUDIO
      Rain on glass, close rain on fabric, footsteps, subway air, train chime. No dialogue. Music may enter only after the dry-arrival payoff.
    reference_warning: "Storyboard/reference boards are production guidance only; do not animate boards, labels, arrows, panels, timing text, or layout."
    audio_policy: "Optional generated diegetic audio; no dialogue; music only after proof beat."
    risk_notes:
      - "Storyboard board can be misread as a visual object."
      - "Product material may drift if material board is not prioritized."
    retry_rules:
      - "If board appears in output, remove rainlock_image_03 and use shot text only."
      - "If shell geometry changes, prioritize rainlock_image_01 and reduce scene count."
  kling:
    enabled: true
    operation: generate
    capability_card_id: kling_video_3_0_official_guide
    version: "3.0"
    status: current
    provider_surface: "Kling AI VIDEO 3.0 product guide"
    access_mode: documented_product
    execution_mode: manual_export
    execution_verification_status: unverified
    desired_audio:
      mode: planned_diegetic_audio
    generation_audio_route: postproduction
    rights_gate_status: unverified
    transformation_contract:
      preserve: []
      change: []
      forbidden_change: []
      overlap_check: pass
    best_for: "Per-shot image-to-video motion from clean use-case stills."
    prompt: |
      Reference boards are planning guidance only; do not show or animate board labels, panels, arrows, grids, timing text, or layout.
      The commuter steps forward from the lobby into heavy rain with calm confidence.
      Water beads move naturally across the graphite rain shell and roll away from the zipper seam.
      City reflections ripple in the wet crosswalk behind the subject.
      The camera tracks laterally at waist height, keeping the shell and dry work bag visible.
    reference_warning: "Use a clean first frame from rainlock_image_02 or rainlock_image_01; do not use the dense storyboard board as the main image."
    audio_policy: "Visual-only generation preferred; add rain, fabric, and train ambience in post."
    risk_notes:
      - "Actions that contradict the still image may cause product or pose drift."
      - "Dense boards reduce image-to-video clarity."
    retry_rules:
      - "If motion fails, keep camera locked and animate only rain beads plus subject step."
      - "If extra people appear, simplify to one commuter and one background layer."
  runway:
    enabled: true
    operation: generate
    generation_capability_card_id: runway_gen_4_5_web
    edit_capability_card_id: ""
    deprecated_card_ids_rejected:
      - runway_gen_4_aleph_api_deprecated
    version: "Gen-4.5"
    status: current
    provider_surface: "Runway web Gen-4.5 generation"
    desired_audio:
      mode: planned_diegetic_audio
    generation_audio_route: postproduction
    rights_gate_status: unverified
    transformation_contract:
      preserve: []
      change: []
      forbidden_change: []
      overlap_check: pass
    best_for: "Short single-beat motion tests from strong product or commute stills."
    prompt: |
      Reference boards are planning guidance only; do not show board labels, panels, arrows, grids, timing text, or layout.
      The subject walks steadily through heavy city rain. Water beads slide across the graphite shell while the camera gently tracks alongside. The work shirt collar stays dry and the subject remains composed.
    reference_warning: "Use one clean image-to-video still per shot. Avoid storyboard boards and long multi-shot scripts."
    audio_policy: "Silent visual-only generation; audio handled in post-production."
    risk_notes:
      - "Overly long prompts can reduce motion clarity."
      - "Negative wording can create unexpected artifacts."
    retry_rules:
      - "Split into R01, R02, R03, R04, and R05 single-shot runs."
      - "Use positive motion wording and one dominant action."
  veo:
    enabled: true
    operation: generate
    capability_card_id: veo_3_1_generate_001_vertex_api
    version: "veo-3.1-generate-001"
    status: current
    provider_surface: "Vertex AI publisher model predictLongRunning API"
    source_conflicts:
      - "The exact stable page says sound generation is not supported; keep the family/API ambiguity visible and use post-production audio."
    desired_audio:
      mode: planned_diegetic_audio
    generation_audio_route: postproduction
    generate_audio_parameter: not_applicable
    rights_gate_status: unverified
    transformation_contract:
      preserve: []
      change: []
      forbidden_change: []
      overlap_check: pass
    best_for: "Structured product film prompt with subject, action, scene, camera, lighting, style, and audio."
    prompt: |
      Reference boards are planning guidance only; do not show or animate board labels, panels, arrows, grids, timing text, or layout.
      Subject: an urban commuter wearing a graphite RainLock waterproof shell, carrying a dry leather work bag.
      Action: the commuter steps into heavy rain, water beads off the shell, crosses a wet city street, adjusts the hood once, and arrives at a train platform with a dry shirt collar.
      Scene: modern city commute, warm lobby threshold, rain-soaked crosswalk, brushed steel station platform.
      Camera: 28mm doorway push, 85mm macro water-bead insert, 35mm lateral track, 50mm dry-arrival close-up.
      Lighting and style: premium urban product advertising, cool rain exterior, amber practical interior light, real material behavior.
      Audio: rain on glass, fabric rustle, footsteps, subway air, train chime, no dialogue.
    reference_warning: "Reference boards guide product identity, commute setting, and shot order only; final video must be the cinematic product ad."
    audio_policy: "Post-production only for this exact stable card: diegetic sound, no dialogue, and optional music."
    risk_notes:
      - "Too many product details can compete with story flow."
      - "Audio support depends on selected Veo product path."
    retry_rules:
      - "If sequence collapses, generate product proof and dry-arrival as separate clips."
      - "If audio is wrong, switch to silent visual-only and post-production audio."

universal_anti_misread_clause: |
  Use storyboard/reference boards only as production guidance.
  Do not show or animate the board, panels, text labels, arrows, grids, timing text, or layout.
  Generate the product ad scene described by the shot list.

