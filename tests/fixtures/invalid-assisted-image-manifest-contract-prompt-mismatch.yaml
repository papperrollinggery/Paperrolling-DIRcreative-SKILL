      image_type: character_identity_reference
      source_patterns:
        - art_directed_asymmetric_layout_v1
        - json_config_prompt_v1
        - surface_integrity_guard_v1
      art_direction_policy:
        non_negotiables:
          - "do not use a generic product grid"
          - "composition must feel art-directed, intentional, and slightly asymmetric"
        placement_rule: "role label must dominate the page."
      quality_and_artifact_control:
        surface_integrity_guard:
          required:
            - "complete natural materials"
          avoid:
            - "fish-scale texture"
      self_update:
        registry_pattern_ids:
          - art_directed_asymmetric_layout_v1
          - surface_integrity_guard_v1
        qa_observations: []
    prompt: |
      {
        "artifact": "cinematic sanitation worker board",
        "canvas": "16:9 landscape production board",
        "layout_policy": "art-directed, intentional, slightly asymmetric, no generic equal grid",
        "hero": "single sanitation worker identity reference board",
        "material_truth": "clean fabric and skin material",
        "style": "cinematic realism"
      }
    exact_text_labels:
      - "CHARACTER IDENTITY REFERENCE"
    avoid:
      - "poster title hierarchy"
    qa:
      role_clear: true
      text_readable: true
      panels_large_enough: true
      continuity_locks_present: true
      output_mode_supported: true
      asset_output_status_present: true
      video_model_safe: true
