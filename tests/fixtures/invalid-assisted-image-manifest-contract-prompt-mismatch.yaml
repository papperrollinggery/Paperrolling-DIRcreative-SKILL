    layout:
      aspect_ratio: "16:9"
      sections:
        - "large character front view"
        - "side view"
      density: "medium"
      readability_rules:
        - "role label must be readable"
    direct_video_input:
      allowed: false
      model_slots: []
      frame_role: planning_only
      shot_id: ""
