    type: "character_identity_reference"
    purpose: "Regression fixture: a good-looking contract must fail when the actual prompt omits title hierarchy instructions."
    sequence_id: "regression-seq-01"
    input_dependencies:
      story_package: "tests/fixtures/invalid-assisted-image-manifest-contract-prompt-mismatch.yaml"
      shot_list: "tests/fixtures/invalid-assisted-image-manifest-contract-prompt-mismatch.yaml"
