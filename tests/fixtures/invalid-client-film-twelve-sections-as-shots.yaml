    rhythm_points_count: 12
    shot_defaults: &bad_shot
      shot_size: "MS"
      camera_position: "front"
      camera_movement: "slow push"
      subject_action: "shows story section"
      emotional_function: "summarizes one client story section"
      props_characters: ["friend"]
      asset_source: "existing"
      vertical_framing: "center"
      reference_motion: "simple movement note"
    shots:
      - <<: *bad_shot
        shot_id: S01
        timecode: "00:00-00:05"
        start_sec: 0
        end_sec: 5
      - <<: *bad_shot
        shot_id: S02
        timecode: "00:05-00:10"
