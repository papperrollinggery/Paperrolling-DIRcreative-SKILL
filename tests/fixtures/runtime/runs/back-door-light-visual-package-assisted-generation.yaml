  real_user_feedback:
    reviewed_in_chat: true
    verdict: not_accepted
    summary: "User is not satisfied with the script/story layer because the assistant skipped over the story development and moved too quickly into visual generation."
    failure_ids:
      - story_development_skipped
      - script_depth_insufficient
      - visual_generation_before_story_lock
    required_fix:
      - "Return to story and script development before treating any visual package as accepted."
      - "Offer story-direction choices and get user confirmation before generating or locking more visual assets."
      - "Do not write live-user-acceptance.yaml from this run."
  revised_story_proposal:
    status: rejected_for_revision
    proposed_direction: "同一个秘密避难所"
    title: "便利店灯下的两个人"
    logline: "上海雨夜，一家虚构便利店侧墙下的监控死角成为两个年轻人的十分钟避难所；他们只交换每天最小的失败，直到某晚规则被打破，真正的压力终于说出口。"
    dramatic_engine:
      - "小失败规则: 每晚只能讲一件小失败，不能讲真正难过的事。"
      - "重复相遇: 便利店灯、雨、饮料、站位每天细微变化，关系从陌生到默契。"
      - "破例时刻: 当两人第一次说出真正的问题，关系从氛围变成剧情。"
      - "结尾动作: 小票背面写着“明天也可以失败一次”，不告白但留下继续出现的可能。"
    user_feedback: "User says the script is not professional enough and lacks story tension."
    required_fix:
      - "Do not continue with the low-tension 'small failure' engine."
      - "Rebuild the story around external pressure, irreversible choice, and a stronger hidden relationship engine."
      - "Write the next proposal as a professional story treatment before any more visual generation."
    required_user_decision: "User must approve a stronger story treatment before more visual assets are generated or locked."
  known_risks:
    - "Generated poster text may need review for legibility."
    - "Character identity consistency across later generations is not locked until user approval."
    - "Clean frame must be self-QA checked before video use."
    - "User says the storyboard/motion page text is thin, unprofessional, and lacks production shot-card writing."
  storyboard_text_feedback:
    reviewed_in_chat: true
    verdict: not_accepted
    failure_id: storyboard_information_density_too_low
    summary: "The generated storyboard image had visual structure, but its visible text descriptions were too thin and did not read like professional director shot-card writing."
    required_fix:
      - "Rewrite storyboard cell text as professional shot-card summaries."
      - "Each cell must include narrative purpose, lens/support/movement, blocking path, continuity lock, sound/edit cue, and model risk."
      - "Do not use thin labels such as wide, close-up, slow push, conversation, or emotional ending as standalone descriptions."

