      - reference_role_label_hierarchy_wrong
    user_feedback: "The largest header reads as the film title. The image type should be the dominant title so the user immediately knows this is a character reference image."
    required_fix:
      - "Make `人物身份参考图 / CHARACTER IDENTITY REFERENCE` the largest title."
      - "Move `Project: Fog Route Cleaner` to smaller secondary metadata."
      - "Keep `NOT DIRECT VIDEO INPUT` visible near the role label."
