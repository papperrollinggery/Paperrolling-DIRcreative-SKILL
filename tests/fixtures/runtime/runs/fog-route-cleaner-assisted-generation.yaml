  project_title: "Fog Route Cleaner"
  source_example: examples/complete-idea-segmentation-test
  authorization_source: real_user
  visual_output_mode: assisted_generation
  longform_generation_mode: single_sequence
  image_generation_provider: chatgpt_image_gen
  video_generation_provider: none
  video_generated: false
  user_lock_required_before_video: true

human_review:
  review_source: real_user
  reviewed_at: "2026-05-16"
  verdict: reject_for_revision
  summary: "Current generated images cannot be locked because character continuity drifts, reference image roles are not explicit enough, and the storyboard board lacks professional shot-card density."
  failure_ids:
    - character_identity_reference_drift
    - reference_asset_role_label_missing
    - storyboard_information_density_too_low
  required_fix:
    - "Generate or import a character identity reference first, then lock it before deriving scene boards or clean video frames."
    - "Each image must carry a large role label in the image itself and the artifact manifest: character reference, scene plus camera movement reference, lighting/material reference, storyboard/motion reference, clean first frame, or clean end frame."
    - "The storyboard/motion board must show full shot-card data per shot: timecode, duration, shot size, lens, camera angle, camera support, camera movement start-to-end, subject blocking, foreground/midground/background, lighting, sound cue, transition, and model risk."

v2_regeneration_strategy:
  mode: sequential_gated_assisted_generation
  principle: "Use fewer images with stronger ownership. Do not let multiple images independently redesign the same character or scene."
  lock_order:
    - character_identity_lock
    - scene_geography_camera_fov_lock
    - professional_storyboard_motion_page_lock
    - selected_clean_frame_generation
  required_core_assets:
    - asset_id: v2_character_identity_reference
      role: character_identity_reference
      visible_role_label: "CHARACTER IDENTITY REFERENCE / 人物参考图 / NOT DIRECT VIDEO INPUT"
      primary_job: "Lock the single sanitation worker identity, body proportion, wardrobe silhouette, protective gear, and cleaning equipment."
      must_include:
        - "front, side, back, and 3/4 action view of the same worker"
        - "face shield, reflective municipal jacket, rubber gloves, cart handle, disinfectant nozzle"
        - "material details without changing costume design"
      must_not_include:
        - "alternate worker designs"
        - "new scene geography"
        - "storyboard panels"
        - "final cinematic shot composition"
      downstream_rule: "All later images must inherit this identity and must not reinterpret face, body, costume, gear, or cart design."
    - asset_id: v2_scene_geography_camera_fov_reference
      role: scene_geography_camera_fov_reference
      visible_role_label: "SCENE GEOGRAPHY + CAMERA FOV REFERENCE / 场景空间+镜头视场参考图 / PLANNING ONLY"
      primary_job: "Lock one street, one route axis, ambulance position, zombie distance, lighting source direction, camera positions, and field-of-view wedges."
      must_include:
        - "wide or 360-degree panoramic street strip"
        - "top-down route diagram"
        - "S01-S06 camera positions"
        - "field-of-view wedges for each shot"
        - "worker path, cart path, ambulance path"
        - "foreground/midground/background zones"
      must_not_include:
        - "alternate streets"
        - "alternate ambulance positions"
        - "new character costume designs"
        - "decorative mood panels that contradict geography"
      downstream_rule: "All later storyboards and clean frames must inherit route direction, vehicle position, light source, and camera axis from this atlas."
    - asset_id: v2_professional_storyboard_motion_map
      role: professional_storyboard_motion_map
      visible_role_label: "PROFESSIONAL STORYBOARD + MOTION MAP / 详细分镜头+镜头运动图 / PLANNING ONLY"
      primary_job: "Show the complete professional storyboard page for user shot review and prompt compilation."
      per_shot_cell_required_fields:
        - shot_id
        - timecode
        - duration
        - shot_image_region
        - detailed_frame_description
        - shot_size
        - focal_length
        - camera_position
        - camera_movement_start_end
        - subject_blocking_start_end
        - foreground_midground_background
        - lighting_cue
        - sound_description
        - transition
        - model_risk
      must_not_include:
        - "new character identity"
        - "new scene geography"
        - "generic one-line captions"
      downstream_rule: "This page is planning-only. It informs timing, movement, sound, and risk; it is not a direct video frame."
  optional_assets_after_locks:
    - asset_id: v2_clean_first_frame
      role: clean_first_frame
      generation_condition: "Only after character and scene anchors pass user lock."
      direct_video_input_after_lock: true
    - asset_id: v2_clean_end_frame
      role: clean_end_frame
      generation_condition: "Only after character and scene anchors pass user lock."
      direct_video_input_after_lock: true
  consistency_rules:
    character_consistency_required: true
    scene_consistency_required: true
    duplicate_visual_truth_forbidden: true
    repeated_content_must_inherit_locked_source: true
    batch_generate_all_assets_before_locks: false
    asset_role_label_must_be_dominant_title: true

v2_trial_attempts:
  - attempt_id: v2-character-identity-reference-attempt-01
    attempted_at: "2026-05-17"
    asset_id: v2_character_identity_reference
    generated_file: /Users/example-user/.codex/generated_images/00000000-0000-7000-8000-000000000001/ig_0ed0741c66e6a4d0016a0895bac5bc819a9c5affddde9e6f01.png
