client_film_gate_contract:
  project_title: "Friendship Route Test"
  target_duration_sec: 60
  channel: "vertical client proposal film"
  aspect_ratio: "9:16"

  gate_status:
    story: pass
    script: pass
    shot: pass
    asset_reference: pass
    prompt_generation: pass
    client_language: pass

  client_visible_text_blocks:
    - "这支一分钟短片不是把十二个段落平铺出来，而是让观众跟着一只旧相册、一只旅行箱和六位朋友的礼物，一步步看见十年友谊如何被重新点亮。每位朋友带来的物件都推动一次回忆和一次当下动作，结尾回到大家同框的庆祝时刻。"
    - "画面节奏会从安静翻看旧照片开始，逐渐进入礼物、拥抱、笑声和奔跑的连续动作。我们用近景留住手部和道具，用中景交代朋友关系，用几个关键运动镜头把回忆连成一条生日路线。"

  story_gate:
    customer_readable_story_preview:
      - "开场从一本旧相册开始，主角翻到第一张合照时，画面不是停在怀旧，而是让桌上的旅行箱慢慢打开。里面露出每位朋友曾经留下的物件，观众会先看见这些物件像线索一样排开，再看见朋友们从不同方向赶来，把回忆重新带回今天。"
      - "中段让六位朋友逐一出现，每个人不是只拿着一个道具摆拍，而是用自己的角色身份完成一个动作：有人负责寻找，有人负责准备点心，有人负责布置，有人把旧布重新变成庆祝背景。故事的重点是这些动作如何互相接上，让十年的陪伴从旧回忆变成正在发生的惊喜。"
      - "结尾不是简单合影，而是大家把物件放回旅行箱，箱子合上时变成一张新的船票。主角抬头看见朋友们已经站成一圈，最后一秒留下的是一起出发的感觉，而不是单纯纪念过去。"
    preserved_brief_requirements:
      - "保留旧相册、旅行箱、船票和朋友礼物作为故事骨架。"
      - "保留原先三条方向，除非用户明确删除。"
      - "保留每位朋友各有角色身份和道具动作。"
    omitted_requirements_without_user_removal: []
    legacy_routes_preserved_until_user_removes: true
    prop_ellipsis_rule:
      source_has_ellipsis: true
      required_friend_count: 6
      expansions:
        - character_id: F01
          role_identity: "观察者朋友"
          prop: "望远镜"
          action: "从阳台发现第一只庆祝气球"
          shot_function: "启动寻找路线"
        - character_id: F02
          role_identity: "照顾者朋友"
          prop: "点心篮"
          action: "把十年前常吃的点心摆回桌面"
          shot_function: "把回忆落到味觉和手部动作"
        - character_id: F03
          role_identity: "布置者朋友"
          prop: "扎染布匹"
          action: "拉开布匹形成庆祝背景"
          shot_function: "完成空间变化"
        - character_id: F04
          role_identity: "记录者朋友"
          prop: "旧拍立得"
          action: "拍下新合影并夹进相册"
          shot_function: "连接过去和当下"
        - character_id: F05
          role_identity: "带路者朋友"
          prop: "手绘地图"
          action: "指向下一段回忆地点"
          shot_function: "推动剪辑节奏"
        - character_id: F06
          role_identity: "惊喜收尾朋友"
          prop: "新船票"
          action: "把船票放到旅行箱最上层"
          shot_function: "触发结尾共同出发"

  script_gate:
    target_duration_sec: 60
    time_budget:
      total_sec: 60
      sections:
        - section_id: A
          seconds: "0-10"
          purpose: "旧相册和旅行箱建立悬念"
        - section_id: B
          seconds: "10-42"
          purpose: "六位朋友和道具接力推进"
        - section_id: C
          seconds: "42-60"
          purpose: "惊喜收束和新船票记忆点"
    vo_budget:
      total_words_estimate: 112
      lines:
        - vo_id: VO01
          text: "十年前，我们把第一次同行藏进一张旧照片。"
          start_sec: 0
          end_sec: 10
          covered_shot_ids: [S01, S02, S03, S04, S05]
          covered_seconds: "00:00-00:10"
        - vo_id: VO02
          text: "今天，每个人都带着自己的线索回来。"
          start_sec: 10
          end_sec: 20
          covered_shot_ids: [S06, S07, S08, S09, S10]
          covered_seconds: "00:10-00:20"
        - vo_id: VO03
          text: "有人负责寻找，有人负责照顾，有人负责把房间变成庆祝的海岸。"
          start_sec: 20
          end_sec: 30
          covered_shot_ids: [S11, S12, S13, S14, S15]
          covered_seconds: "00:20-00:30"
        - vo_id: VO04
          text: "那些看似普通的小物件，原来都是我们一起走过的路线。"
          start_sec: 30
          end_sec: 40
          covered_shot_ids: [S16, S17, S18, S19, S20]
          covered_seconds: "00:30-00:40"
        - vo_id: VO05
          text: "当新照片夹进相册，十年没有停在过去。"
          start_sec: 40
          end_sec: 50
          covered_shot_ids: [S21, S22, S23, S24, S25]
          covered_seconds: "00:40-00:50"
        - vo_id: VO06
          text: "它只是变成下一次出发前，所有人都在场的约定。"
          start_sec: 50
          end_sec: 60
          covered_shot_ids: [S26, S27, S28, S29, S30]
          covered_seconds: "00:50-00:60"

  shot_gate:
